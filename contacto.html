<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva | Descubre Manta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo"><h1>Descubre Manta</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destinos.html">Atractivos</a></li>
                <li><a href="servicios.html">Paquetes</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title">Reserva tu Experiencia</h2>
        <p class="section-subtitle">Déjanos tus datos y un asesor especializado en turismo de Manta se contactará contigo para planificar tu viaje.</p>

        <div class="form-container">
            <form action="#" method="get">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo Electrónico *</label>
                        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono / WhatsApp *</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="+593 99 000 0000" required>
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha estimada de viaje *</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="form-group">
                        <label for="destino">Destino o Hotel de interés *</label>
                        <input type="text" id="destino" name="destino" placeholder="Ej. Hotel Oro Verde" required>
                    </div>

                    <div class="form-group">
                        <label for="personas">Número de personas *</label>
                        <input type="number" id="personas" name="personas" min="1" max="50" placeholder="Ej. 2" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="tipo_servicio">Paquete / Servicio de Interés *</label>
                        <select id="tipo_servicio" name="tipo_servicio" required>
                            <option value="" disabled selected>-- Selecciona un servicio --</option>
                            <option value="lujo">Escapada de Lujo 5 Estrellas</option>
                            <option value="gastronomia">Ruta del Maní y los Mariscos</option>
                            <option value="kitesurf">Kitesurf Camp (Santa Marianita)</option>
                            <option value="citytour">City Tour "Manta Moderna"</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="mensaje">Mensaje o peticiones especiales *</label>
                        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Cuéntanos si tienes alergias alimentarias o peticiones de accesibilidad..." required></textarea>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="btn-submit">Solicitar Cotización Gratuita</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer><div class="footer-bottom"><p>&copy; 2026 Descubre Manta.</p></div></footer> >linea para realizar commit
</body>
</html>
